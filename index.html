&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;

    };

      new CustomEvent(&quot;openai:set_globals&quot;, {

      }),

  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||

        ports.length !== 1

        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

    }

  /* NYC geographic polygons projected with d3-geo; pan-first district renderer. */
function createCityScene({ canvas, data, detail = null, onChange = function () {}, onParkClick = function () {}, onGroundClick = function () {}, overlay = null, onCanvasClick = null }) {
  if (!window.d3 || !d3.geoMercator) throw new Error(&#x27;d3-geo must load before createCityScene.&#x27;);
  const ctx = canvas.getContext(&#x27;2d&#x27;, { alpha: false });
  const center = data.center || d3.geoCentroid(data.park);
  const projection = d3.geoMercator().center(center).translate([0, 0]).scale(6378137 * Math.cos(center[1] * Math.PI / 180));
  const initial = { angle: -0.46, tilt: 1.05, zoom: .72, panX: 0, panY: 0 };
  let view = { ...initial }, mode = &#x27;city&#x27;, parkColor = &#x27;#f34250&#x27;, heightScale = .38;
  let width = 1, height = 1, dpr = 1, scale = 1, ca = 1, sa = 0, st = 1, ct = 1;
  let raf = 0, destroyed = false, placing = false, drag = null, pins = [], ghost = 1;
  let visibleBuildingCount = 0, renderMilliseconds = 0, lastFaceCount = 0;
  const clamp = (n, min, max) =&gt; Math.max(min, Math.min(max, n));
  const point = (x, y, z) =&gt; ({ x, y, z });
  const geoToLocal = coordinate =&gt; { const p = projection(coordinate); return point(p[0], 0, p[1]); };
  const localToGeo = p =&gt; projection.invert([p.x, p.z]);
  const geometry = value =&gt; value &amp;&amp; (value.geometry || value);
  const features = value =&gt; value &amp;&amp; value.type === &#x27;FeatureCollection&#x27; ? value.features : value ? [value] : [];
  function cleanRing(ring) {
    const result = ring.map(geoToLocal).filter(p =&gt; Number.isFinite(p.x) &amp;&amp; Number.isFinite(p.z));
    if (result.length &gt; 2 &amp;&amp; Math.hypot(result[0].x - result.at(-1).x, result[0].z - result.at(-1).z) &lt; .001) result.pop();
    return result;
  }
  function polygons(value) {
    const g = geometry(value); if (!g) return [];
    const parts = g.type === &#x27;Polygon&#x27; ? [g.coordinates] : g.type === &#x27;MultiPolygon&#x27; ? g.coordinates : [];
    return parts.map(part =&gt; part.map(cleanRing).filter(ring =&gt; ring.length &gt;= 3)).filter(part =&gt; part.length);
  }
  function ringArea(ring) {
    let area = 0;
    ring.forEach((p, i) =&gt; { const q = ring[(i + 1) % ring.length]; area += p.x * q.z - q.x * p.z; });

  }
